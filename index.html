<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saoudien ou confiture ?</title><style>:root{--ink:#241d22;--red:#c42b43;--blue:#286493;--gold:#f1bd3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;font-family:system-ui,-apple-system,"Avenir Next",sans-serif;color:var(--ink);background:repeating-linear-gradient(45deg,#fff5e8 0 19px,#f9dddd 19px 38px)}.app{width:min(880px,100%);overflow:hidden;border:5px solid #fff;border-radius:28px;background:#fffaf1;box-shadow:0 22px 70px #54283435}header{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#261f24;color:#fff;padding:20px 28px}h1{margin:0;font-size:clamp(1.55rem,4vw,2.35rem);letter-spacing:-.065em}h1 b{color:#ff7382}.score{background:#fff;color:#271f23;border-radius:99px;padding:8px 13px;font-weight:900;white-space:nowrap}.main{padding:24px}.intro{max-width:680px;text-align:center;margin:0 auto 17px;line-height:1.45;font-weight:620}.round{margin:0 0 10px;text-align:center;color:#76525c;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;font-weight:900}.scene{position:relative;width:min(650px,100%);aspect-ratio:1;margin:auto;overflow:hidden;border:8px solid #261f24;border-radius:24px;background:#eee}.scene img{width:100%;height:100%;object-fit:contain;display:block}.full{display:none;position:absolute;inset:0;background:#171417}.full.visible{display:block}.zoom{position:absolute;inset:0}.zoom img{object-fit:cover}.choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0 10px}button{font:inherit;border:0;border-radius:15px;padding:14px 20px;font-size:1.04rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0002}.saudi{color:#fff;background:var(--blue)}.jam{color:#fff;background:var(--red)}.next{display:none;background:var(--gold);color:#372b10;margin:6px auto}.next.visible{display:block}.feedback{min-height:32px;margin:0;text-align:center;font-size:1.08rem;font-weight:900}.tip{text-align:center;color:#71636a;font-size:.87rem;margin:10px 0 0}.end{display:none;text-align:center;padding:38px 16px 28px}.end.visible{display:block}.end h2{font-size:clamp(2rem,7vw,3.6rem);letter-spacing:-.065em;margin:0;color:#261f24}.finalscore{font-size:clamp(3.5rem,12vw,6.5rem);font-weight:950;color:var(--red);line-height:1;margin:17px 0 8px}.message{font-size:1.2rem;font-weight:800;margin:0 auto 22px;max-width:570px;line-height:1.4}.replay{background:var(--gold);color:#372b10;margin:auto}@media(max-width:600px){body{padding:8px}.app{border-radius:19px}header{padding:16px}.main{padding:17px 12px}.scene{border-width:5px;border-radius:17px}}</style></head><body><section class="app"><header><h1>Saoudien ou <b>confiture</b> ?</h1><span id="score" class="score">Score : 0 / 0</span></header><main class="main" id="game"><p class="intro">Observe exclusivement le tissu rouge et blanc. Est-ce le couvre-pot d’une confiture ou le keffieh d’un Saoudien ?</p><p id="round" class="round"></p><div class="scene"><div id="zoom" class="zoom"><img id="zoomImg" alt="Zoom sur un tissu rouge et blanc"></div><div id="full" class="full"><img id="fullImg" alt="Photo complète révélant la solution"></div></div><div id="choices" class="choices"><button class="saudi" data-answer="saudi">🇸🇦 Un Saoudien</button><button class="jam" data-answer="jam">🍓 Un pot de confiture</button></div><p id="feedback" class="feedback">À toi de jouer !</p><button id="next" class="next">Manche suivante →</button><p class="tip">8 manches, dans un ordre aléatoire à chaque partie.</p></main><section id="end" class="end"><h2>Partie terminée !</h2><div id="finalscore" class="finalscore">0 / 8</div><p id="message" class="message"></p><button id="replay" class="replay">Rejouer ↻</button></section></section><script>const all=[['jam','IMG_3441.jpeg','IMG_3449.jpeg','un pot de confiture'],['saudi','IMG_3444.jpeg','IMG_3443.png','un Saoudien'],['jam','IMG_3451.jpeg','IMG_3450.png','un pot de confiture'],['jam','IMG_3453.jpeg','IMG_3452.png','un pot de confiture'],['saudi','IMG_3455.jpeg','IMG_3454.webp','un Saoudien'],['saudi','IMG_3459.jpeg','IMG_3458.png','un Saoudien'],['jam','IMG_3461.jpeg','IMG_3460.png','un pot de confiture'],['saudi','IMG_3463.jpeg','IMG_3462.png','un Saoudien']].map(([answer,zoom,full,label])=>({answer,zoom,full,label}));let rounds=[],i=0,score=0,locked=false;const $=s=>document.querySelector(s);function shuffle(a){for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function newGame(){rounds=shuffle([...all]);i=0;score=0;$('#end').classList.remove('visible');$('#game').style.display='block';render()}function render(){const r=rounds[i];locked=false;$('#round').textContent=`Manche ${i+1} sur ${rounds.length}`;$('#zoomImg').src=r.zoom;$('#fullImg').src=r.full;$('#zoom').style.display='block';$('#full').classList.remove('visible');$('#choices').style.display='flex';$('#feedback').textContent='À toi de jouer !';$('#next').classList.remove('visible');$('#score').textContent=`Score : ${score} / ${i}`}function finish(){let m=score===8?'🏆 Maître du motif ! Impossible de te piéger.':score>=6?'👁️ Œil de lynx : tu distingues les tissus au premier regard.':score>=4?'👏 Pas mal du tout : les motifs t’ont résisté, mais tu as tenu bon.':'😄 Les motifs t’ont bien piégé… Revanche ?';$('#game').style.display='none';$('#end').classList.add('visible');$('#finalscore').textContent=`${score} / ${rounds.length}`;$('#message').textContent=m;$('#score').textContent=`Score final : ${score} / ${rounds.length}`}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const r=rounds[i],ok=b.dataset.answer===r.answer;if(ok)score++;$('#zoom').style.display='none';$('#full').classList.add('visible');$('#choices').style.display='none';$('#feedback').textContent=ok?`✅ Exact ! C’était ${r.label}.`:`❌ Piège ! C’était ${r.label}.`;$('#score').textContent=`Score : ${score} / ${i+1}`;$('#next').textContent=i===rounds.length-1?'Voir mon résultat →':'Manche suivante →';$('#next').classList.add('visible')});$('#next').onclick=()=>{if(i===rounds.length-1)finish();else{i++;render()}};$('#replay').onclick=newGame;newGame();</script></body></html>
